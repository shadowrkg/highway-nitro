<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Highway Nitro — 3D Endless Racer</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;font-family:Arial,Helvetica,sans-serif}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
  .panel{position:absolute;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 14px;backdrop-filter:blur(5px)}
  #stats{top:12px;left:12px;min-width:155px}
  #rank{top:12px;right:12px;text-align:right}
  #message{top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;text-align:center;opacity:0;transition:opacity .2s}
  .big{font-size:25px;font-weight:900}
  .bar{height:8px;width:150px;background:#222;border-radius:5px;overflow:hidden;margin-top:4px}
  .fill{height:100%;width:100%;background:#20b8ff}
  #boostFill{background:#19bfff}
  #damageFill{background:#ff4444}
  #speed{font-size:34px;font-weight:900}
  #mini{position:absolute;right:12px;top:90px;width:110px;height:150px;border:1px solid #fff5;border-radius:10px;background:#061008aa;overflow:hidden}
  #mini canvas{width:100%;height:100%}
  #touch{position:absolute;left:0;right:0;bottom:15px;display:flex;justify-content:space-between;padding:0 14px;pointer-events:auto}
  .touchGroup{display:flex;gap:10px}
  button{width:68px;height:58px;border:1px solid #fff5;border-radius:15px;background:#111b;color:#fff;font-size:22px;font-weight:bold;touch-action:none;user-select:none}
  button:active,.pressed{background:#168dd1}
  #help{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.75}
  @media(min-width:900px){#touch{display:none}}
</style>
</head>
<body>
<div id="hud">
  <div id="stats" class="panel">
    <div id="speed">0 <small>KM/H</small></div>
    <div>Distance: <b id="distance">0 m</b></div>
    <div>Boost</div><div class="bar"><div id="boostFill" class="fill"></div></div>
    <div>Damage</div><div class="bar"><div id="damageFill" class="fill"></div></div>
  </div>
  <div id="rank" class="panel"><div class="big" id="rankText">3rd</div><div>RACE POSITION</div></div>
  <div id="mini"><canvas id="miniCanvas" width="110" height="150"></canvas></div>
  <div id="message"></div>
  <div id="touch">
    <div class="touchGroup"><button data-key="left">◀</button><button data-key="right">▶</button></div>
    <div class="touchGroup"><button data-key="brake">▼</button><button data-key="accel">▲</button><button data-key="boost">⚡</button></div>
  </div>
  <div id="help">Arrow keys / WASD • Space or Shift = Nitro</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x82c9ee);
scene.fog = new THREE.Fog(0x82c9ee, 80, 260);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, .1, 500);
camera.position.set(0,5.2,10);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfe8ff,0x31522d,2.1));
const sun = new THREE.DirectionalLight(0xffffff,2.3);
sun.position.set(-40,70,30); sun.castShadow=true; scene.add(sun);

const ROAD_W=18, LANE_W=ROAD_W/6;
const laneX=i=>(i-2.5)*LANE_W;

const mat=(color,rough=.8)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const roadMat=mat(0x292d31), grassMat=mat(0x2d8a3d), whiteMat=mat(0xf4f4e8), dark=mat(0x14171a);
const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W,1000),roadMat);
road.rotation.x=-Math.PI/2; road.position.z=-350; road.receiveShadow=true; scene.add(road);

const grass = new THREE.Mesh(new THREE.PlaneGeometry(150,1000),grassMat);
grass.rotation.x=-Math.PI/2; grass.position.y=-.03; grass.position.z=-350; scene.add(grass);

const roadside=[];
for(let z=20;z>-760;z-=12){
  for(const side of [-1,1]){
    const x=side*(ROAD_W/2+5+Math.random()*4);
    const tree=new THREE.Group();
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2.5,8),mat(0x70452b));
    trunk.position.y=1.25;
    const crown=new THREE.Mesh(new THREE.SphereGeometry(1.8+Math.random(),8,6),mat(0x176b32));
    crown.position.y=3.2;
    tree.add(trunk,crown); tree.position.set(x,0,z); tree.scale.setScalar(.8+Math.random()*.7);
    scene.add(tree); roadside.push(tree);
    if(z%24===0){
      const pole=new THREE.Group();
      const p=new THREE.Mesh(new THREE.CylinderGeometry(.08,.11,5,6),dark); p.position.y=2.5;
      const lamp=new THREE.Mesh(new THREE.BoxGeometry(.35,.08,.25),whiteMat); lamp.position.set(0,5,.15);
      pole.add(p,lamp); pole.position.set(side*(ROAD_W/2+2.3),0,z+5);
      scene.add(pole); roadside.push(pole);
    }
  }
}

// Road lane markings
const markings=[];
for(let z=15;z>-900;z-=9){
  for(let l=1;l<6;l++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,4.2),whiteMat);
    m.position.set(-ROAD_W/2+l*LANE_W,.015,z); scene.add(m); markings.push(m);
  }
  // edge lines
  for(const x of [-ROAD_W/2,ROAD_W/2]){
    const e=new THREE.Mesh(new THREE.BoxGeometry(.18,.03,6),whiteMat);
    e.position.set(x,.02,z); scene.add(e); markings.push(e);
  }
}

function makeCar(color, scale=1){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.62,4.3),mat(color,.45));
  body.position.y=.62; body.castShadow=true; g.add(body);
  const hood=new THREE.Mesh(new THREE.BoxGeometry(1.9,.3,1.35),mat(color,.4));
  hood.position.set(0,.92,-1.15); g.add(hood);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.65,1.7),mat(0x15202a,.2));
  cabin.position.set(0,1.15,.35); g.add(cabin);
  const bumper=new THREE.Mesh(new THREE.BoxGeometry(2.15,.22,.25),dark);
  bumper.position.set(0,.42,-2.15); g.add(bumper);
  const lightMat=mat(0xffffcc);
  for(const x of [-.72,.72]){
    const lamp=new THREE.Mesh(new THREE.BoxGeometry(.35,.18,.08),lightMat);
    lamp.position.set(x,.75,-2.19); g.add(lamp);
  }
  const wheelMat=mat(0x090909);
  for(const x of [-1.05,1.05]) for(const z of [-1.35,1.35]){
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,12),wheelMat);
    w.rotation.z=Math.PI/2; w.position.set(x,.42,z); g.add(w);
  }
  g.scale.setScalar(scale);
  return g;
}

const player=makeCar(0xe52b2b,1);
player.position.set(0,0,7); scene.add(player);

const rivals=[
  {mesh:makeCar(0x2c6ee8,.98), x:laneX(-1), z:-18, lane:-1, speed:30, targetSpeed:30, change:1.5},
  {mesh:makeCar(0xf1a91b,.98), x:laneX(1), z:-38, lane:1, speed:28, targetSpeed:28, change:2.5}
];
rivals.forEach(r=>{r.mesh.position.set(r.x,0,r.z);scene.add(r.mesh)});

const traffic=[];
function spawnTraffic(z, oncoming=false){
  const bike=Math.random()<.25;
  const v=bike?makeBike(Math.random()<.5?0x222222:0xff6b1a):makeCar(Math.random()<.5?0x8b8f99:0x38a5a2,.72);
  const lane=Math.floor(Math.random()*6);
  const obj={mesh:v,lane,oncoming,z,speed:(oncoming?-22:18)+Math.random()*12,bike,oncoming};
  v.position.set(laneX(lane),bike?.25:0,z); scene.add(v); traffic.push(obj);
}
function makeBike(color){
  const g=new THREE.Group(), c=mat(color,.5), black=mat(0x111111);
  const frame=new THREE.Mesh(new THREE.BoxGeometry(.35,.35,1.6),c); frame.position.y=.75; g.add(frame);
  for(const z of [-.65,.65]){
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.12,12),black); w.rotation.z=Math.PI/2; w.position.set(0,.4,z); g.add(w);
  }
  const rider=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),mat(0x334455)); rider.position.y=1.35; g.add(rider);
  return g;
}
for(let i=0;i<26;i++) spawnTraffic(-35-i*28, Math.random()<.38);

const input={left:false,right:false,accel:false,brake:false,boost:false};
const keyMap={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'accel',w:'accel',W:'accel',ArrowDown:'brake',s:'brake',S:'brake',' ':'boost',Shift:'boost'};
addEventListener('keydown',e=>{if(keyMap[e.key]){input[keyMap[e.key]]=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(keyMap[e.key])input[keyMap[e.key]]=false});
document.querySelectorAll('button').forEach(b=>{
  const k=b.dataset.key;
  const down=e=>{e.preventDefault();input[k]=true;b.classList.add('pressed')};
  const up=e=>{e.preventDefault();input[k]=false;b.classList.remove('pressed')};
  b.addEventListener('pointerdown',down); b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up);
});

let speed=0, distance=0, boost=100, damage=0, boostTime=0, flash=0;
const maxSpeed=62;
const clock=new THREE.Clock();

function moveWorld(dz){
  for(const o of [...roadside,...markings]){o.position.z+=dz;if(o.position.z>30)o.position.z-=900}
  for(const t of traffic){t.mesh.position.z+=dz}
  for(const r of rivals){r.mesh.position.z+=dz}
}
function crashEffect(pos){
  flash=.18;
  for(let i=0;i<18;i++){
    const p=new THREE.Mesh(new THREE.SphereGeometry(.05+Math.random()*.09,5,5),mat(0xffa62b));
    p.position.copy(pos); p.position.y+=.5;
    p.userData.v=new THREE.Vector3((Math.random()-.5)*8,Math.random()*7,(Math.random()-.5)*8);
    scene.add(p);
    setTimeout(()=>scene.remove(p),700);
    const tick=()=>{if(p.parent){p.position.addScaledVector(p.userData.v,.016);p.userData.v.y-=12*.016;requestAnimationFrame(tick)}};
    tick();
  }
}

function rank(){
  const racers=[{z:player.position.z,me:true},...rivals.map(r=>({z:r.mesh.position.z}))];
  racers.sort((a,b)=>b.z-a.z); // more positive is farther ahead
  return racers.findIndex(x=>x.me)+1;
}
function ordinal(n){return n===1?'1st':n===2?'2nd':'3rd'}

const msg=document.getElementById('message');
function show(text){msg.textContent=text;msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,600)}

function update(dt){
  const boosting=input.boost && boost>0 && speed>10;
  if(boosting){boostTime=.25;boost=Math.max(0,boost-34*dt)}
  else boost=Math.min(100,boost+8*dt);
  const accel=boosting?55:24;
  if(input.accel)speed+=accel*dt;
  else speed-=7*dt;
  if(input.brake)speed-=34*dt;
  speed=THREE.MathUtils.clamp(speed,0,maxSpeed+(boosting?30:0));

  const steer=(input.right?1:0)-(input.left?1:0);
  player.position.x+=steer*(5.5+speed*.07)*dt;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-7.4,7.4);
  player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,-steer*.12,.12);

  const worldSpeed=speed*dt;
  moveWorld(worldSpeed);
  distance+=speed*dt*.82;

  // AI: adaptive speed and periodic lane changes/overtaking.
  rivals.forEach(r=>{
    r.change-=dt;
    if(r.change<=0){
      r.lane=Math.floor(Math.random()*6)-2.5;
      r.x=laneX(Math.round(r.lane));
      r.change=2+Math.random()*4;
    }
    r.targetSpeed=28+Math.sin(distance*.015+r.z)*5+(r.mesh.position.z>player.position.z?5:0);
    r.speed=THREE.MathUtils.lerp(r.speed,r.targetSpeed,dt*.6);
    r.mesh.position.x=THREE.MathUtils.lerp(r.mesh.position.x,r.x,dt*.9);
    r.mesh.position.z+=worldSpeed-r.speed*dt;
    r.mesh.rotation.y=THREE.MathUtils.lerp(r.mesh.rotation.y,(r.x-r.mesh.position.x)*-.03,.1);
  });

  // Traffic recycling and collisions.
  traffic.forEach(t=>{
    t.mesh.position.z+=worldSpeed - t.speed*dt;
    if(t.mesh.position.z>35 || t.mesh.position.z<-760){
      t.mesh.position.z=-650-Math.random()*180;
      t.lane=Math.floor(Math.random()*6);
      t.mesh.position.x=laneX(t.lane);
      t.oncoming=Math.random()<.38;
      t.speed=(t.bike?20:18)+Math.random()*14;
    }
    const dx=Math.abs(t.mesh.position.x-player.position.x);
    const dz=Math.abs(t.mesh.position.z-player.position.z);
    if(dx<1.55 && dz<2.5 && damage<100){
      damage=Math.min(100,damage+22);
      speed*=.35;
      t.mesh.position.z-=5;
      crashEffect(player.position);
      show("CRASH!");
    }
  });

  rivals.forEach(r=>{
    if(Math.abs(r.mesh.position.x-player.position.x)<1.7 && Math.abs(r.mesh.position.z-player.position.z)<2.8){
      speed*=.75; r.mesh.position.z-=3;
    }
  });

  if(damage>=100){speed*=.96;show("CAR DAMAGED");damage=55}

  // Chase camera
  const targetX=player.position.x*.45;
  camera.position.x=THREE.MathUtils.lerp(camera.position.x,targetX,.08);
  camera.position.y=THREE.MathUtils.lerp(camera.position.y,5.1+(boosting?.5:0),.08);
  camera.position.z=THREE.MathUtils.lerp(camera.position.z,10.5-(boosting?1.5:0),.08);
  camera.lookAt(player.position.x*.25,.75,-8);

  // HUD
  document.getElementById('speed').innerHTML=Math.round(speed*3.6)+' <small>KM/H</small>';
  document.getElementById('distance').textContent=Math.floor(distance)+' m';
  document.getElementById('boostFill').style.width=boost+'%';
  document.getElementById('damageFill').style.width=(100-damage)+'%';
  document.getElementById('rankText').textContent=ordinal(rank());

  if(boosting && Math.random()<.5){
    const line=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,3+Math.random()*4),mat(0x29bfff));
    line.position.set(player.position.x+(Math.random()-.5)*1.5,.4,player.position.z+1);
    line.rotation.x=(Math.random()-.5)*.2;
    scene.add(line); setTimeout(()=>scene.remove(line),100);
  }
  if(flash>0){renderer.domElement.style.filter='brightness(2)';flash-=dt}else renderer.domElement.style.filter='';

  drawMini();
}

function drawMini(){
  const c=document.getElementById('miniCanvas'),x=c.getContext('2d');
  x.clearRect(0,0,110,150); x.fillStyle='#0a1710';x.fillRect(0,0,110,150);
  x.fillStyle='#555';x.fillRect(42,0,26,150);
  x.strokeStyle='#aaa';x.setLineDash([5,5]);x.strokeRect(43,0,24,150);x.setLineDash([]);
  const mapY=z=>THREE.MathUtils.clamp(75-(z-player.position.z)*.45,5,145);
  x.fillStyle='#ff3333';x.beginPath();x.arc(55,mapY(player.position.z),5,0,7);x.fill();
  rivals.forEach((r,i)=>{x.fillStyle=i?'#ffc400':'#4da3ff';x.beginPath();x.arc(55,mapY(r.mesh.position.z),4,0,7);x.fill()});
}

function loop(){
  const dt=Math.min(clock.getDelta(),.033);
  update(dt); renderer.render(scene,camera); requestAnimationFrame(loop);
}
loop();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
